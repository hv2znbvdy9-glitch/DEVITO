name: PSScriptAnalyzer

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**/*.ps1'
      - '.github/workflows/psscriptanalyzer.yml'
  pull_request:
    paths:
      - 'scripts/**/*.ps1'
      - '.github/workflows/psscriptanalyzer.yml'

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer (best-practices)
        shell: pwsh
        run: |
          $excludeRules = @(
            'PSAvoidUsingWriteHost'
          )
          $results = Invoke-ScriptAnalyzer -Path "$PWD/scripts/*.ps1" -Severity Warning, Error -ExcludeRule $excludeRules
          if ($results) {
            $results | ForEach-Object {
              if ($_.Severity -eq 'Error') {
                Write-Host "::error file=$($_.ScriptName),line=$($_.Line),col=$($_.Column)::$($_.RuleName): $($_.Message)"
              } else {
                Write-Host "::warning file=$($_.ScriptName),line=$($_.Line),col=$($_.Column)::$($_.RuleName): $($_.Message)"
              }
            }
            if (@($results | Where-Object { $_.Severity -eq 'Error' }).Count -gt 0) {
              throw "PSScriptAnalyzer reported error-severity findings."
            }
            Write-Host "PSScriptAnalyzer reported warning-severity findings only; workflow continues."
          }
