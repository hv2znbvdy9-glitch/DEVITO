name: AVA Hay L5b Reference Tests

on:
  pull_request:
    paths:
      - "ava/neuron_models.py"
      - "tests/test_neuron_models.py"
      - ".github/workflows/ava-hay-neuron-model.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neuron-model-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest tests/test_neuron_models.py
