name: Secret Detection
# Detection only. Blocking force pushes must be configured via branch protection.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (credentials, API keys, tokens)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --report-format json --report-path gitleaks.json --exit-code 1
      - name: GitGuardian (only if GITGUARDIAN_API_KEY configured)
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: |
          if [ -n "$GITGUARDIAN_API_KEY" ]; then
            pip install ggshield && ggshield secret scan ci
          else
            echo "GITGUARDIAN_API_KEY not set; skipped"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secret-detection-${{ github.run_id }}
          path: gitleaks.json
          if-no-files-found: ignore
